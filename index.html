<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Base Apparel coming soon page</title>
  <link rel="stylesheet" href="style.css">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main class="container">
        <section class="content-side">
            <header class="logo">
                <img src="./images/logo.svg" alt="Base Apparel Logo">
            </header>

            <div class="hero-mobile">
                <img src="./images/hero-mobile.jpg" alt="Woman in an orange shirt">
            </div>

            <div class="text-content">
                <h1><span>We're</span> coming soon</h1>
                <p>Hello fellow shoppers! We're currently building our new fashion store. Add your email below to stay up-to-date with announcements and our launch deals.</p>
                
                <form id="email-form" novalidate>
                    <div class="input-group">
                        <input type="email" id="email" placeholder="Email Address">
                        <img class="error-icon" src="./images/icon-error.svg" alt="Error">
                        <button type="submit">
                            <img src="./images/icon-arrow.svg" alt="Submit">
                        </button>
                    </div>
                    <small class="error-text">Please provide a valid email</small>
                </form>
            </div>
        </section>

        <section class="image-side"></section>
    </main>

    <script src="script.js"></script>
</body>
</html>
